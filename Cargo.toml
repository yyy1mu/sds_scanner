[package]
name = "sds-scanner"
version = "0.1.0"
edition = "2021"
description = "Locate passkey security-domain secrets (SDS) in Chrome process memory dumps"

[dependencies]
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
memmap2 = "0.9"
memchr = "2"
rayon = "1"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
p256 = { version = "0.13", features = ["ecdsa", "arithmetic"] }
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_Debug",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
